name: Deploy GitHub Pages (Playground + Docs)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "mkdocs.yml"
      - "src/trackflow/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install docs dependencies
        run: uv sync --python 3.12 --extra docs
      - name: Build documentation site into _site/docs
        run: uv run mkdocs build --strict -d _site/docs
      - name: Stage WebGPU playground at site root
        run: |
          cp -R web/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
