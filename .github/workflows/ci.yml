name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: macos-15, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Node (web playground parity tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev
      - name: Lint with ruff
        run: uv run ruff check src tests
      - name: Run tests
        run: uv run pytest
      - name: Build wheel & sdist
        run: uv build
      - name: Verify signed INT8 inference on Apple Silicon
        if: runner.os == 'macOS'
        env:
          TRACKFLOW_TEST_WEIGHTS: "1"
        run: uv run pytest tests/test_model_weights.py -k "dfine-n-int8"

  model-weights:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12 --extra dev --extra transformers
      - name: Run every detector on the reference video
        env:
          TRACKFLOW_TEST_WEIGHTS: "1"
        run: uv run --no-sync pytest tests/test_model_weights.py
