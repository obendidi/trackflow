[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trackflow-python"
version = "0.6.1"
description = "Stream or export multi-object tracks with ONNX and optional Transformers detectors, ByteTrack, BoT-SORT, OC-SORT or BoostTrack, text search, floorplan projection, and anonymization."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Ouail Bendidi" },
]
keywords = [
  "object-tracking",
  "people-tracking",
  "multi-object-tracking",
  "mot",
  "bytetrack",
  "botsort",
  "ocsort",
  "boosttrack",
  "rtdetr",
  "rf-detr",
  "d-fine",
  "onnxruntime",
  "computer-vision",
  "video-tracking",
  "re-identification",
  "homography",
  "parquet",
  "webgpu",
  "clip",
  "siglip",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "huggingface-hub>=0.24",
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "opencv-python-headless>=4.9",
  "pyarrow>=15.0",
  "rich>=13.7",
  "scipy>=1.11",
  "tokenizers>=0.19",
  "typer>=0.12",
]

[project.optional-dependencies]
transformers = [
  "transformers>=5.18,<6",
  "torch>=2.6",
  "torchvision>=0.21",
  "sentence-transformers>=6.1,<7",
]
display = [
  "opencv-python>=4.9",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
docs = [
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.29",
]

[project.scripts]
trackflow = "trackflow.cli:app"
trackflow-python = "trackflow.cli:app"

[project.urls]
Homepage = "https://obendidi.github.io/trackflow/"
Documentation = "https://obendidi.github.io/trackflow/docs/"
Repository = "https://github.com/obendidi/trackflow"
Issues = "https://github.com/obendidi/trackflow/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/trackflow"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
